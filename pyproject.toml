[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-log"
version = "0.1.0"
description = "Behavioral log analysis for Linux. Detects when a machine starts behaving differently."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
aether = "aether.cli:app"

[tool.setuptools.packages.find]
include = ["aether*"]
